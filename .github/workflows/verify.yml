name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standalone-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Exact native Hermes test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: f42f579cf8bac4918ac9599bece71618afadd846
          path: .docker-input/hermes-source
          persist-credentials: false
      - name: Build disposable test runtime
        run: |
          cp requirements-test.txt .docker-input/
          docker build -f docker/Dockerfile -t hermes-kanban-review-recording:test .docker-input
      - name: Canonical verification (no live installation)
        run: bash scripts/verify-docker.sh
      - name: Runtime complexity
        run: bash scripts/verify-docker.sh ruff check --no-cache --isolated --select C901 --config 'lint.mccabe.max-complexity = 10' __init__.py scripts/verify.py
